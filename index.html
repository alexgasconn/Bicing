<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BicingAI Barcelona</title>
  <meta name="description"
    content="App ràpida en català per veure Bicing en temps real a Barcelona, optimitzada per Android i Windows." />
  <meta name="theme-color" content="#ef3437" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BicingAI" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@500;700;800&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom scrollbar */
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* User Location Pulse Animation */
    .user-location-marker {
      position: relative;
    }

    .user-pulse {
      width: 20px;
      height: 20px;
      background: #3b82f6;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      position: relative;
      z-index: 10;
    }

    .user-pulse::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      background: rgba(59, 130, 246, 0.4);
      border-radius: 50%;
      animation: pulse-ring 2s infinite;
      z-index: -1;
    }

    @keyframes pulse-ring {
      0% {
        width: 100%;
        height: 100%;
        opacity: 0.8;
      }

      100% {
        width: 300%;
        height: 300%;
        opacity: 0;
      }
    }

    /* Vertical Slider for Rotation */
    .slider-vertical {
      writing-mode: bt-lr;
      /* IE */
      -webkit-appearance: slider-vertical;
      /* Webkit */
      width: 8px;
      height: 100px;
      padding: 0 5px;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 antialiased overflow-hidden">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
